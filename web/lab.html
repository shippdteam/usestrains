<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>strains</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css">
<style>
.top{padding-top:34px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.nums{display:flex;flex-wrap:wrap;gap:16px 0}
.num{padding:0 26px 0 12px;border-left:2px solid var(--ink)}
.num b{display:block;font:500 30px/1 var(--mono);letter-spacing:-.05em}
.num span{display:block;margin-top:6px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-2)}
.num.clock b{color:var(--lime-deep)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:40px}
.tabs{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;overflow-x:auto;max-width:100%;background:var(--paper)}
.tabs button{flex:none;white-space:nowrap;height:42px;padding:0 16px;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tabs button.on{background:var(--ink);color:var(--lime)}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:30px;margin-top:22px;align-items:start}
@media(max-width:1060px){.lay{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.sc{position:relative;display:block;background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:var(--press);overflow:hidden;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.sc:hover{transform:translate(-1px,-3px);box-shadow:var(--press-hover)}
.sc .pic{position:relative;height:178px;background:radial-gradient(circle at 50% 46%,#26302A,var(--ink) 72%);display:grid;place-items:center;overflow:hidden}
.sc .pic:before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;border:1.5px solid rgba(182,242,58,.35);box-shadow:0 0 40px rgba(182,242,58,.2) inset}
.sc .pic .cr{position:relative;width:138px;height:138px;filter:drop-shadow(0 0 16px rgba(182,242,58,.4))}
.sc.dead .pic{background:radial-gradient(circle at 50% 46%,#3a3a3a,#161616 72%)}.sc.dead .pic:before{border-color:rgba(238,61,82,.35);box-shadow:0 0 40px rgba(238,61,82,.15) inset}.sc.dead .pic .cr{filter:none;opacity:.85}
.rk{position:absolute;left:12px;top:12px;font:500 12px var(--mono);color:var(--lime);background:rgba(16,21,17,.7);border:1px solid rgba(182,242,58,.4);border-radius:6px;padding:4px 8px}
.flags{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.flags .tag{background:var(--paper)}.flags .tag.pink{background:var(--pink)}.flags .tag.red{background:var(--blood)}
.sc .body{padding:14px 16px 16px}
.sc h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:400 25px/1.1 var(--serif);letter-spacing:-.02em;font-variation-settings:"SOFT" 100,"WONK" 1}
.sc h3 small{font:500 11px var(--mono);letter-spacing:.04em;color:var(--dim)}
.meter{height:8px;border:1.5px solid var(--ink);border-radius:99px;margin-top:12px;overflow:hidden;background:#fff}
.meter i{display:block;height:100%;background:var(--lime)}
.sc.low .meter i{background:var(--blood)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{font-size:11px;color:var(--dim)}.kv b{display:block;font:500 15px var(--mono);color:var(--ink)}
.cn{display:flex;gap:6px;margin-top:12px;min-height:34px;align-items:center}
.cn img{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--ink);object-fit:cover;background:var(--agar)}
.cn span{font-size:11px;color:var(--dim)}
.rip{margin-top:10px;font-size:12px;color:var(--blood-deep)}
.side{position:sticky;top:86px}
.panel{background:var(--ink);color:var(--paper);border-radius:14px;padding:22px}
.panel .label{color:var(--lime)}
.fd{margin-top:10px;max-height:calc(100vh - 180px);overflow:auto;scrollbar-width:thin}
.fd a,.fd div.e{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--ink-line);font-size:12.5px;color:#D6DED0;line-height:1.45}
.fd .ic{width:34px;height:34px;border-radius:8px;background:var(--ink-3);overflow:hidden}.fd .ic svg{width:100%;height:100%;display:block}
.fd small{display:block;margin-top:3px;color:var(--mist);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.fd .death small{color:#FF8796}.fd .birth small{color:var(--pink)}.fd .launch small,.fd .verdict small{color:var(--lime)}
</style>
</head>
<body>
<header class="dock"><a class="word" href="/">strains</a><nav><a href="/">Home</a><a class="on" href="/lab">The lab</a><a href="/me">My strains</a></nav><div class="right"><button class="chip ghost hide-m" data-wallet>Connect</button><a class="chip" href="/create">Create</a></div></header>
<main class="wrap">
  <div class="top">
    <div><div class="label">The lab</div><h1 class="h1">Survival of <em>the fittest</em></h1><p class="lede">Every strain alive, ranked by its score. On the hour the top two breed and the bottom one dies.</p></div>
    <div class="nums"><div class="num"><b id="nA">–</b><span>Alive</span></div><div class="num"><b id="nD">–</b><span>Dead</span></div><div class="num"><b id="nC">–</b><span>Coins</span></div><div class="num clock"><b id="clk">--:--</b><span>Next cycle</span></div></div>
  </div>
  <div class="bar"><div class="tabs" id="tabs"><button class="on" data-s="rank">Leaderboard</button><button data-s="new">Newest</button><button data-s="gen">Bloodlines</button><button data-s="dead">Graveyard</button></div><span class="mono-dim" id="hint"></span></div>
  <div class="lay">
    <div class="grid" id="grid"></div>
    <aside class="side"><div class="panel"><div class="label">Live feed</div><div class="fd" id="fd"></div></div></aside>
  </div>
</main>
<footer class="foot"><div class="in"><div class="word">strains</div><nav><a href="/create">Create</a><a href="/me">My strains</a><a href="/#faq">FAQ</a><a class="xlink" href="https://x.com/usestrains" target="_blank" rel="noopener">X ↗</a></nav></div></footer>
<script src="/assets/creature.js"></script>
<script src="/assets/app.js"></script>
<script>
const { $, esc, sol, ago, until, api, creature, every } = ST;
let sort = 'rank', ALIVE = 0;
const LBL = { launch: 'Launch', verdict: 'Judge', birth: 'Birth', death: 'Death', burn: 'Burn', payout: 'Paid' };
$('grid').innerHTML = '<div class="skel" style="height:340px"></div>'.repeat(6);
function card(s, i) {
  const dead = s.status === 'dead', f = Math.max(0, Math.min(100, +s.form || 0));
  const low = !dead && sort === 'rank' && s.rank && s.rank === ALIVE && ALIVE > 1;
  const flags = [];
  if (!dead && sort === 'rank' && s.rank && s.rank <= 2 && ALIVE > 1) flags.push('<span class="tag pink">Top 2</span>');
  if (low) flags.push('<span class="tag red">Last place</span>');
  if (s.co_owned) flags.push('<span class="tag">Bred · 50/50</span>');
  if (s.paused) flags.push('<span class="tag">Paused</span>');
  if (!dead && s.error && /fuel/i.test(s.error)) flags.push('<span class="tag red">No fuel</span>');
  const coins = (s.coins || []).map((c) => `<img src="${esc(c.image_url || '')}" alt="$${esc(c.ticker)}" title="$${esc(c.ticker)}" loading="lazy">`).join('');
  return `<a class="sc ${dead ? 'dead' : ''} ${low ? 'low' : ''}" href="/s/${esc(s.slug)}">
    <div class="pic"><span class="cr ${dead ? '' : 'bob'}" style="animation-delay:-${(i * .37) % 3}s">${creature(s.genome, { dead })}</span>${!dead && s.rank ? `<span class="rk">#${s.rank}</span>` : dead ? '<span class="rk" style="color:#FF8796;border-color:rgba(238,61,82,.5)">R.I.P.</span>' : '<span class="rk">new</span>'}<div class="flags">${flags.join('')}</div></div>
    <div class="body"><h3>${esc(s.name)}<small>gen ${s.generation}</small></h3>
      ${dead ? `<div class="rip">Died ${ago(s.died_at)}. ${esc(s.death_note || '')}</div>` : `<div class="meter"><i style="width:${f}%"></i></div>`}
      <div class="kv"><div><b>${s.form != null ? (+s.form).toFixed(1) : '–'}</b>score</div><div><b>${s.launches}</b>coins</div><div><b>${sol(s.fees_sol, 3)}</b>SOL fees</div></div>
      <div class="cn">${coins || `<span>${dead ? 'No coins' : s.next_launch_at ? 'First coin in ' + until(s.next_launch_at) : 'No coins yet'}</span>`}</div></div></a>`;
}
async function load() {
  try {
    const { strains } = await api('strains?sort=' + sort);
    $('grid').innerHTML = strains.length ? strains.map(card).join('') : `<div class="empty" style="grid-column:1/-1">${sort === 'dead' ? 'Nobody has died yet.' : 'The lab is empty. <a href="/create" style="text-decoration:underline">Make the first strain.</a>'}</div>`;
  } catch { $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">Could not load the lab. Refresh to try again.</div>'; }
}
$('tabs').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; sort = b.dataset.s; [...$('tabs').children].forEach((x) => x.classList.toggle('on', x === b)); $('hint').textContent = { rank: 'Ranked by score', new: 'Newest first', gen: 'Most generations deep', dead: 'Most recent deaths' }[sort]; load(); };
async function feed() {
  try {
    const { events } = await api('events?limit=40');
    $('fd').innerHTML = events.length ? events.map((e) => { const href = e.strain ? '/s/' + e.strain.slug : e.data && e.data.sig ? 'https://solscan.io/tx/' + e.data.sig : null, tag = href ? 'a' : 'div'; return `<${tag} class="e ${e.type}" ${href ? `href="${esc(href)}"${e.strain ? '' : ' target="_blank" rel="noopener"'}` : ''}><span class="ic">${e.strain ? creature(e.strain.genome, { dead: e.type === 'death' }) : ''}</span><span>${esc(e.text)}<small>${LBL[e.type] || e.type} · ${ago(e.at)}${!e.strain && e.data && e.data.sig ? ' · tx ↗' : ''}</small></span></${tag}>`; }).join('') : '<div class="e"><span></span><span>Nothing yet. Births, launches, verdicts and deaths show up here.</span></div>';
  } catch {}
}
api('site').then((s) => { ALIVE = s.alive; $('nA').textContent = s.alive; $('nD').textContent = s.dead; $('nC').textContent = s.coins; if (s.x_url) document.querySelectorAll('.xlink').forEach((a) => (a.href = s.x_url)); load(); }).catch(load);
$('hint').textContent = 'Ranked by score';
feed(); setInterval(feed, 30000);
setInterval(() => { const d = new Date(); d.setUTCMinutes(60, 0, 0); const s = Math.max(0, (d - Date.now()) / 1000); $('clk').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }, 500);
</script>
</body>
</html>
